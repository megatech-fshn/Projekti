<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeleCom Plus | Rivendos Fjalëkalimin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/improvements.css" />
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="brand-link">TeleCom Plus</a>
        <h2 class="mt-3">Rivendos Fjalëkalimin</h2>
        <p class="text-muted">Vendos fjalëkalimin e ri për llogarinë tënde.</p>
      </div>

      <form id="resetPasswordForm" class="needs-validation-custom" novalidate>
        <div class="mb-3">
          <label for="resetEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="resetEmail" name="email" placeholder="email@kompania.al" required />
          <small class="error-message"></small>
        </div>

        <div class="mb-3">
          <label for="newPassword" class="form-label">Fjalëkalimi i Ri</label>
          <div class="input-group">
            <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="Minimumi 8 karaktere, 1 shkronjë e madhe dhe 1 numër" required minlength="8" autocomplete="new-password" />
            <button class="btn btn-outline-secondary" type="button" id="toggleResetPw" data-toggle-password="newPassword" aria-label="Shfaq fjalëkalimin" style="border-color:var(--bd);background:var(--bg-input);color:var(--tx-2)">👁</button>
          </div>
          <small class="error-message"></small>
        </div>

        <div class="mb-3">
          <label for="confirmNewPassword" class="form-label">Konfirmo Fjalëkalimin</label>
          <div class="input-group">
            <input type="password" class="form-control" id="confirmNewPassword" name="confirmNewPassword" placeholder="Ripërsërit fjalëkalimin" required minlength="8" autocomplete="new-password" />
            <button class="btn btn-outline-secondary" type="button" id="toggleConfirmResetPw" data-toggle-password="confirmNewPassword" aria-label="Shfaq fjalëkalimin" style="border-color:var(--bd);background:var(--bg-input);color:var(--tx-2)">👁</button>
          </div>
          <small class="error-message"></small>
        </div>

        <button type="submit" class="btn btn-primary w-100">Ruaj Fjalëkalimin e Ri</button>

        <div id="resetSuccessMessage" class="alert alert-success mt-4 d-none">
          Fjalëkalimi u rivendos me sukses. Po kthehesh te faqja e login...
        </div>

        <p class="text-center mt-4 mb-0">
          Kthehu te
          <a href="login.html" class="text-decoration-none fw-semibold">Login</a>
        </p>
      </form>
    </div>
  </div>
  <script src="js/script.js"></script>
  <script src="js/improvements.js"></script>
</body>
</html>
