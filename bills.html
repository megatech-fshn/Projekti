<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeleCom Plus | Faturat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/improvements.css" />
</head>
<body class="dashboard-body">
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div>
        <a href="index.html" class="brand-link sidebar-brand">TeleCom Plus</a>
        <nav class="sidebar-nav mt-4">
          <a data-icon="⬡" href="dashboard.html">Dashboard</a>
          <a data-icon="◈" class="active" href="bills.html">Faturat</a>
          <a data-icon="◇" href="payments.html">Pagesat</a>
          <a data-icon="⇄" href="transactions.html">Transaksionet</a>
          <a data-icon="◉" href="notifications.html">Njoftime</a>
          <a data-icon="▣" href="services.html">Shërbimet</a>
          <a data-icon="○" href="profile.html">Profili</a>
          <a data-icon="◎" href="customer-service.html">Customer Service</a>
          <a data-icon="◆" href="admin.html">Admin</a>
        </nav>
      </div>
      <div class="sidebar-footer">
        <a href="index.html" class="btn btn-outline-light w-100">Kthehu në homepage</a>
      </div>
    </aside>

    <main class="dashboard-main">

<div class="topbar">
  <div>
    <h2 class="mb-1">Faturat</h2>
    <p class="text-muted mb-0">Shiko listën e plotë të faturave dhe statusin e tyre.</p>
  </div>
</div>

<div class="dashboard-card">
  <div class="filters-row three-cols">
    <div>
      <label for="billStatusFilter" class="form-label">Filtro sipas statusit</label>
      <select id="billStatusFilter" class="form-select">
        <option value="all">Të gjitha</option>
        <option value="Paguar">Paguar</option>
        <option value="Papaguar">Papaguar</option>
        <option value="Vonuar">Vonuar</option>
      </select>
    </div>

    <div>
      <label for="billSearchInput" class="form-label">Kërko faturë</label>
      <input type="text" id="billSearchInput" class="form-control" placeholder="Kërko me nr. fature ose shërbim" />
    </div>

    <div>
      <label for="billSortSelect" class="form-label">Renditja</label>
      <select id="billSortSelect" class="form-select">
        <option value="newest">Më të rejat</option>
        <option value="highest">Shuma më e lartë</option>
        <option value="lowest">Shuma më e ulët</option>
      </select>
    </div>
  </div>

  <div class="table-responsive mt-4">
    <table class="table custom-table align-middle">
      <thead>
        <tr>
          <th>Nr. Faturës</th>
          <th>Shërbimi</th>
          <th>Data</th>
          <th>Afati</th>
          <th>Shuma</th>
          <th>Statusi</th>
          <th>Veprimi</th>
        </tr>
      </thead>
      <tbody id="billsTableBody"></tbody>
    </table>
  </div>
</div>

    </main>
  </div>

  <script src="js/script.js"></script>
  <script src="js/improvements.js"></script>
</body>
</html>
