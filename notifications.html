<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/improvements.css" />
</head>
<body class="dashboard-body">
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div>
        <a href="index.html" class="brand-link sidebar-brand">TeleCom Plus</a>
        <nav class="sidebar-nav mt-4">
          <a data-icon="⬡" href="dashboard.html">Dashboard</a>
          <a data-icon="◈" href="bills.html">Faturat</a>
          <a data-icon="◇" href="payments.html">Pagesat</a>
          <a data-icon="⇄" href="transactions.html">Transaksionet</a>
          <a data-icon="◉" class="active" href="notifications.html">Njoftime</a>
          <a data-icon="▣" href="services.html">Shërbimet</a>
          <a data-icon="○" href="profile.html">Profili</a>
          <a data-icon="◎" href="customer-service.html">Customer Service</a>
          <a data-icon="◆" href="admin.html">Admin</a>
        </nav>
      </div>
      <div class="sidebar-footer">
        <a href="index.html" class="btn btn-outline-light w-100">Kthehu në homepage</a>
      </div>
    </aside>

    <main class="dashboard-main">

<div class="topbar">
  <div>
    <h2 class="mb-1">Qendra e Njoftimeve</h2>
    <p class="text-muted mb-0">Të gjitha lajmërimet për pagesat, faturat dhe shërbimet e tua.</p>
  </div>
  <div class="topbar-actions d-flex gap-2 align-items-center">
    <span id="unreadBadge" class="notification-pill" style="display:none"></span>
    <button type="button" class="btn btn-outline-primary" id="markAllReadBtn">Shënoji të gjitha si të lexuara</button>
  </div>
</div>

<div class="dashboard-card">
  <div class="filters-row">
    <div>
      <label for="notificationTypeFilter" class="form-label">Filtro sipas llojit</label>
      <select id="notificationTypeFilter" class="form-select">
        <option value="all">Të gjitha</option>
        <option value="billing">Billing</option>
        <option value="payment">Payment</option>
        <option value="service">Service</option>
        <option value="system">System</option>
      </select>
    </div>

    <div>
      <label for="notificationSearchInput" class="form-label">Kërko njoftim</label>
      <input type="text" id="notificationSearchInput" class="form-control" placeholder="Kërko sipas titullit ose përmbajtjes" />
    </div>
  </div>

  <div class="notifications-page-list mt-4" id="notificationsPageList"></div>
</div>

    </main>
  </div>

  <script src="js/script.js"></script>
  <script src="js/improvements.js"></script>
</body>
</html>
