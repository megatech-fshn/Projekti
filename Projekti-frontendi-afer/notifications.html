<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telecom Albania | Njoftime</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/improvements.css" />
  <link rel="stylesheet" href="css/visual-upgrade.css" />
</head>
<body class="dashboard-body">
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div>
        <a href="index.html" class="brand-link sidebar-brand" aria-label="TeleCom home"><img src="assets/logo-telecom.png" alt="TeleCom" class="brand-logo" /></a>
        <div class="sidebar-user-info" id="sidebarUserInfo" style="margin-top:12px;padding:10px 12px;background:rgba(120,80,255,0.12);border-radius:10px;border:1px solid rgba(120,80,255,0.22)">
          <div style="font-size:0.72rem;color:var(--tx-3);margin-bottom:2px">I kyçur si</div>
          <div id="sidebarUserName" style="font-size:0.84rem;font-weight:600;color:var(--tx-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</div>
          <div id="sidebarUserRole" style="font-size:0.7rem;color:var(--indigo);margin-top:1px">—</div>
        </div>
        <nav class="sidebar-nav mt-4">
          <a data-icon="⬡" href="dashboard.html">Dashboard</a>
          <a data-icon="◈" href="bills.html">Faturat</a>
          <a data-icon="◇" href="payments.html">Pagesat</a>
          <a data-icon="⇄" href="transactions.html">Transaksionet</a>
          <a data-icon="◉" class="active" href="notifications.html">Njoftime</a>
          <a data-icon="▣" href="services.html">Shërbimet</a>
          <a data-icon="○" href="profile.html">Profili</a>
          <a data-icon="◎" href="customer-service.html">Customer Service</a>
          <a data-icon="◆" href="admin.html">Admin</a>
        </nav>
      </div>
      <div class="sidebar-footer">
        <a href="index.html" class="btn btn-outline-light w-100 mb-2">Kthehu në homepage</a>
        <button type="button" class="btn btn-outline-danger w-100" id="sidebarSignOutBtn" hidden>⏻ Sign Out</button>
      </div>
    </aside>

    <main class="dashboard-main">

<div class="topbar">
  <div>
    <h2 class="mb-1">Qendra e Njoftimeve</h2>
    <p class="text-muted mb-0">Të gjitha lajmërimet për pagesat, faturat dhe shërbimet e tua.</p>
  </div>
  <div class="topbar-actions d-flex gap-2 align-items-center">
    <span id="unreadBadge" class="notification-pill" style="display:none"></span>
    <button type="button" class="btn btn-outline-primary" id="markAllReadBtn">Shënoji të gjitha si të lexuara</button>
  </div>
</div>

<div class="dashboard-card">
  <div class="filters-row">
    <div>
      <label for="notificationTypeFilter" class="form-label">Filtro sipas llojit</label>
      <select id="notificationTypeFilter" class="form-select">
        <option value="all">Të gjitha</option>
        <option value="billing">Billing</option>
        <option value="payment">Payment</option>
        <option value="service">Service</option>
        <option value="system">System</option>
      </select>
    </div>

    <div>
      <label for="notificationSearchInput" class="form-label">Kërko njoftim</label>
      <input type="text" id="notificationSearchInput" class="form-control" placeholder="Kërko sipas titullit ose përmbajtjes" />
    </div>
  </div>

  <div class="notifications-page-list mt-4" id="notificationsPageList"></div>
</div>

    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
  <script src="js/improvements.js"></script>
  <script src="js/visual-upgrade.js"></script>
</body>
</html>
