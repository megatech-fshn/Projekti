<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telecom Albania | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/improvements.css" />
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="brand-link">Telecom Albania</a>
        <h2 class="mt-3">Hyr në Llogari</h2>
        <p class="text-muted">Vendos kredencialet për të hyrë në panelin tënd.</p>
      </div>

      <div class="demo-hint mb-4">
        <strong>Demo user:</strong> arber.kola@telecomplus.al / user12345<br>
        <strong>Demo admin:</strong> admin@telecomplus.al / admin12345
      </div>

      <form id="loginForm" class="needs-validation-custom" novalidate>
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" name="email" placeholder="email@kompania.al" required />
          <small class="error-message"></small>
        </div>

        <div class="mb-3">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="loginPassword" name="password" placeholder="********" required minlength="6" />
            <button class="btn btn-outline-secondary" type="button" id="toggleLoginPw" data-toggle-password="loginPassword" aria-label="Shfaq fjalëkalimin" style="border-color:var(--bd);background:var(--bg-input);color:var(--tx-2)">👁</button>
          </div>
          <small class="error-message"></small>
        </div>

        <div id="loginErrorMessage" class="alert alert-danger d-none mb-3">Email ose password i pasaktë.</div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe" />
            <label class="form-check-label" for="rememberMe">Mbaje mend llogarinë</label>
          </div>
          <a href="forgot-password.html" class="small text-decoration-none">Harrove fjalëkalimin?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>

        <p class="text-center mt-4 mb-0">
          Nuk ke llogari?
          <a href="register.html" class="text-decoration-none fw-semibold">Regjistrohu</a>
        </p>
      </form>
    </div>
  </div>
  <script src="js/script.js"></script>
  <script src="js/improvements.js"></script>
</body>
</html>
