<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telecom Albania | Faqja nuk u gjet (404)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/improvements.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--indigo) 0%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0;
      letter-spacing: -4px;
    }

    .error-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--tx-1);
      margin: 16px 0 12px;
    }

    .error-desc {
      color: var(--tx-3);
      font-family: var(--font-mono);
      font-size: 0.84rem;
      margin-bottom: 32px;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }

    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-glow {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120,60,220,0.22) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .error-brand {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--tx-3);
      letter-spacing: -0.3px;
      margin-bottom: 40px;
      text-decoration: none;
      display: block;
      transition: color 0.15s;
    }
    .error-brand:hover { color: var(--tx-1); }
  </style>
</head>
<body>
  <div class="error-glow"></div>
  <div class="error-page">
    <div>
      <a href="index.html" class="error-brand">Telecom Albania</a>
      <div class="error-code">404</div>
      <div class="error-title">Faqja nuk u gjet</div>
      <p class="error-desc">
        URL-ja që kërkuat nuk ekziston ose ka ndryshuar.<br>
        Kontrolloni adresën ose kthehuni mbrapa.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary px-4">Shko te Kreu</a>
        <a href="dashboard.html" class="btn btn-outline-primary px-4">Dashboard</a>
        <button type="button" data-history-back class="btn btn-outline-dark px-4">← Kthehu mbrapa</button>
      </div>
    </div>
  </div>
  <script src="js/script.js"></script>
  <script src="js/improvements.js"></script>
</body>
</html>
