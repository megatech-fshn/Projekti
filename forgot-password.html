<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeleCom Plus | Harrove Fjalëkalimin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/improvements.css" />
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="brand-link">TeleCom Plus</a>
        <h2 class="mt-3">Harrove Fjalëkalimin?</h2>
        <p class="text-muted">
          Vendos email-in tënd dhe sistemi do të vazhdojë me procesin e rivendosjes së fjalëkalimit.
        </p>
      </div>

      <form id="forgotPasswordForm" class="needs-validation-custom" novalidate>
        <div class="mb-3">
          <label for="forgotEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="forgotEmail" name="email" placeholder="email@kompania.al" required />
          <small class="error-message"></small>
        </div>

        <div id="forgotErrorMessage" class="alert alert-danger d-none mb-3">Ky email nuk ekziston në sistem.</div>
        <button type="submit" class="btn btn-primary w-100">Dërgo Linkun</button>

        <div id="forgotSuccessMessage" class="alert alert-success mt-4 d-none">
          Kërkesa u pranua me sukses. Po vazhdohet me rivendosjen e fjalëkalimit...
        </div>

        <p class="text-center mt-4 mb-0">
          Kthehu te
          <a href="login.html" class="text-decoration-none fw-semibold">Login</a>
        </p>
      </form>
    </div>
  </div>
  <script src="js/script.js"></script>
  <script src="js/improvements.js"></script>
</body>
</html>
